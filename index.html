<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuvU 💌</title>
  
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-container">
  <h1>Welcome to LuvU 💌</h1>
  <p class="subtitle">Who are you?</p>
  <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
    <button id="btn-aly" class="nav-btn active" onclick="setRole('Aly')" style="flex: 1;">👩 Aly</button>
    <button id="btn-sebo" class="nav-btn" onclick="setRole('Sebo')" style="flex: 1;">👨 Sebo</button>
  </div>
  <div class="login-box" id="login-form" style="display: none;">
    <input type="email" id="email-input" placeholder="Your Email" required>
    <input type="password" id="password-input" placeholder="Your Password" required>
    <button id="login-btn" class="nav-btn active" style="width: 100%; margin-top: 10px;">Log In</button>
    <button id="signup-btn" class="nav-btn" style="width: 100%; margin-top: 10px;">Sign Up</button>
  </div>
  <p id="login-message" style="color: #9b6b7a; margin-top: 15px; font-size: 0.9rem;"></p>
</div>

<!-- APP -->
<div id="app-screen" class="app" style="display: none;">
  
  <div class="nav-tabs">
    <button id="tab-letters" class="nav-btn active" onclick="switchTab('letters')">💌 Letters</button>
    <button id="tab-myday" class="nav-btn" onclick="switchTab('myday')">☀️ Our Day</button>
    <button id="tab-secrets" class="nav-btn" onclick="switchTab('secrets')">✨ Secrets</button>
    <button id="tab-us" class="nav-btn" onclick="switchTab('us')">📸 Us</button>
    <button class="nav-btn" onclick="logout()">🚪 Logout</button>
  </div>

  <!-- SEITEN -->
  <div id="page-letters" class="page active">
    <h1>for you 💌</h1>
    <p class="subtitle">a few letters from me</p>
    <div class="envelopes" id="envelopes"></div>
  </div>

  <div id="page-myday" class="page">
    <h1>our day ☀️</h1>
    <div class="days-list" id="daysList"></div>
  </div>

  <!-- HIER IST DIE ÄNDERUNG 1: Der neue Herz-Stapel -->
  <div id="page-secrets" class="page">
    <h1>little secrets 🩵</h1>
    <p class="subtitle">a little pile of hearts for you</p>
    <div class="hearts-stack" id="heartsStack"></div>
  </div>

  <div id="page-us" class="page">
    <h1>us 📸</h1>
    <div class="pinboard-container">
      <div class="pinboard" id="pinboard"></div>
    </div>
  </div>

  <!-- FAB -->
  <div class="fab-container" id="fab-container" style="z-index: 9999;">
    <div class="fab-menu" id="fab-menu"></div>
    <button class="fab-btn" id="fab-btn" onclick="toggleFab()">+</button>
  </div>

  <!-- OVERLAYS -->
  <!-- Brief lesen -->
  <div class="letter-view" id="letterView">
    <div class="letter-card">
      <button class="close-btn" onclick="document.getElementById('letterView').classList.remove('open')">✕</button>
      <h2 id="letterTitle"></h2>
      <div class="letter-media" id="letterMedia"></div>
      <div class="letter-body" id="letterBody"></div>
    </div>
  </div>

  <!-- Brief schreiben -->
  <div class="letter-view" id="addLetterView">
    <div class="letter-card">
      <button class="close-btn" onclick="document.getElementById('addLetterView').classList.remove('open')">✕</button>
      <h2>Write a new letter 💌</h2>
      <input type="text" id="new-letter-title" placeholder="Title" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #c9a9b4; border-radius: 8px;">
      <textarea id="new-letter-body" placeholder="Your message..." style="width: 100%; height: 150px; padding: 10px; border: 1px solid #c9a9b4; border-radius: 8px; margin-bottom: 15px;"></textarea>
      <button onclick="submitLetter()" class="nav-btn active" style="width: 100%;">Send Letter</button>
    </div>
  </div>

  <!-- Us Moment hinzufügen (Nur Bild) -->
  <div class="letter-view" id="addUsView">
    <div class="letter-card">
      <button class="close-btn" onclick="document.getElementById('addUsView').classList.remove('open')">✕</button>
      <h2>Add a Us Moment 📸</h2>
      <input type="file" id="us-image" accept="image/*" style="margin-bottom: 15px;">
      <button onclick="submitUsMoment()" class="nav-btn active" style="width: 100%;">Add to Pinboard</button>
    </div>
  </div>

  <!-- Our Day hinzufügen (Datum, Bild, Text) -->
  <div class="letter-view" id="addOurDayView">
    <div class="letter-card">
      <button class="close-btn" onclick="document.getElementById('addOurDayView').classList.remove('open')">✕</button>
      <h2>Add to Our Day ☀️</h2>
      <input type="date" id="ourday-date" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #c9a9b4; border-radius: 8px;">
      <input type="file" id="ourday-image" accept="image/*" style="width: 100%; margin-bottom: 15px;">
      <textarea id="ourday-text" placeholder="What happened today?" style="width: 100%; height: 100px; padding: 10px; border: 1px solid #c9a9b4; border-radius: 8px; margin-bottom: 15px;"></textarea>
      <button onclick="submitOurDay()" class="nav-btn active" style="width: 100%;">Save Moment</button>
    </div>
  </div>

  <!-- Secret hinzufügen (Nur Text) -->
  <div class="letter-view" id="addSecretView">
    <div class="letter-card">
      <button class="close-btn" onclick="document.getElementById('addSecretView').classList.remove('open')">✕</button>
      <h2>Write a Secret 🩵</h2>
      <textarea id="secret-text" placeholder="Write something just for them..." style="width: 100%; height: 150px; padding: 10px; border: 1px solid #c9a9b4; border-radius: 8px; margin-bottom: 15px;"></textarea>
      <button onclick="submitSecret()" class="nav-btn active" style="width: 100%;">Save Secret</button>
    </div>
  </div>

  <!-- HIER IST DIE ÄNDERUNG 2: Das neue Overlay für das Briefchen -->
  <div class="letter-view" id="secretView">
    <div class="letter-card" style="background: #fff5f7; border-color: #f4d5de;">
      <button class="close-btn" onclick="document.getElementById('secretView').classList.remove('open')">✕</button>
      <h2 style="color: #d86c8a;">A little secret 🩵</h2>
      <div class="letter-body" id="secretBody" style="font-size: 1.5rem; text-align: center; margin-top: 20px;"></div>
    </div>
  </div>

</div> <!-- Ende von app-screen -->

  <script src="script.js"></script>
</body>
</html>
