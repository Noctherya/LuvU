<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuvU</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- Navigations-Leiste -->
    <div class="nav-tabs">
      <button class="nav-btn active" onclick="switchTab('letters')">💌 Letters</button>
      <button class="nav-btn" onclick="switchTab('myday')">☀️ My Day</button>
      <button class="nav-btn" onclick="switchTab('secrets')">✨ For You</button>
      <button class="nav-btn" onclick="switchTab('us')">📸 Us</button>
    </div>

    <!-- SEITE 1: Briefe -->
    <div id="page-letters" class="page active">
      <h1>for you 💌</h1>
      <p class="subtitle">a few letters from me</p>
      <div class="envelopes" id="envelopes"></div>
    </div>

    <!-- SEITE 2: My Day -->
    <div id="page-myday" class="page">
      <h1>my day ☀️</h1>
      <p class="subtitle">click on a day to see our moments</p>
      <div class="days-list" id="daysList"></div>
    </div>

    <!-- SEITE 3: Secrets -->
    <div id="page-secrets" class="page secrets-page-theme">
      <h1>little secrets 🩵</h1>
      <p class="subtitle">tap the pile to reveal something</p>
      <div class="hearts-container" id="heartsContainer"></div>
      <div id="openedSecretsSection" style="display: none; margin-top: 40px;">
        <h2 class="opened-title">opened secrets</h2>
        <div class="opened-list" id="openedList"></div>
      </div>
    </div>

    <!-- SEITE 4: Us -->
    <div id="page-us" class="page">
      <h1>us 📸</h1>
      <p class="subtitle">our little moments</p>
      <div class="pinboard-container">
        <div class="string-lights"></div>
        <div class="pinboard" id="pinboard"></div>
      </div>
    </div>

    <!-- Overlays -->
    <div class="letter-view" id="letterView">
      <div class="letter-card">
        <button class="close-btn" id="closeBtn">✕</button>
        <h2 id="letterTitle"></h2>
        <div id="letterBody" class="letter-body"></div>
        <div id="letterMedia" class="letter-media"></div>
      </div>
    </div>

    <div class="letter-view" id="dayView">
      <div class="letter-card">
        <button class="close-btn" id="closeDayBtn">✕</button>
        <h2 id="dayDetailDate"></h2>
        <div id="dayDetailContent" class="day-detail-content"></div>
      </div>
    </div>

    <div class="letter-view" id="secretView">
      <div class="letter-card secret-popup-card">
        <button class="close-btn" id="closeSecretBtn">✕</button>
        <p id="secretBody" class="secret-body"></p>
        <div id="secretMedia" class="secret-media"></div>
      </div>
    </div>

    <div class="letter-view" id="imageView">
      <div class="image-popup">
        <button class="close-btn" id="closeImageBtn">✕</button>
        <img id="enlargedImage" src="" alt="Us">
      </div>
    </div>
  </div>

  <script>
    function switchTab(tabName) {
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('page-' + tabName).classList.add('active');
      const buttons = document.querySelectorAll('.nav-btn');
      if (tabName === 'letters') buttons[0].classList.add('active');
      else if (tabName === 'myday') buttons[1].classList.add('active');
      else if (tabName === 'secrets') buttons[2].classList.add('active');
      else if (tabName === 'us') buttons[3].classList.add('active');
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js?v=2"></script>
</body>
</html>
