<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuvU Test</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Der Login-Bildschirm -->
  <div id="login-screen" class="login-container">
    <h1>LuvU 💌</h1>
    <p class="subtitle">Test-Modus</p>
    <button onclick="fakeLogin()" class="nav-btn active" style="width: 100%; margin-top: 10px;">Einloggen (Test)</button>
  </div>

  <!-- Die App -->
  <div id="app-screen" class="app" style="display: none;">
    <div class="nav-tabs">
      <button class="nav-btn active" onclick="switchTab('letters')">💌 Letters</button>
      <button class="nav-btn" onclick="switchTab('us')">📸 Us</button>
    </div>

    <div id="page-letters" class="page active">
      <h1>Briefe</h1>
      <p>Hier sind die Briefe.</p>
    </div>

    <div id="page-us" class="page">
      <h1>Us</h1>
      <p>Hier sind die Bilder.</p>
    </div>

    <!-- Das Plus-Menü -->
    <div class="fab-container" style="z-index: 9999;">
      <div class="fab-menu" id="fab-menu">
        <button class="fab-item" onclick="alert('Us Moment geklickt!')">📸 Us Moment</button>
      </div>
      <button class="fab-btn" id="fab-btn" onclick="toggleFab()">+</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
